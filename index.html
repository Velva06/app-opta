<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#102c26">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Campus Activo">
    <title>Campus Activo</title>
    <link rel="manifest" href="manifest.webmanifest">
    <link rel="apple-touch-icon" href="assets/icon-192.png">
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell" aria-label="Campus Activo">
      <section class="phone-frame">
        <div class="app-status">
          <span>9:41</span>
          <span class="status-dots" aria-hidden="true">
            <i></i><i></i><i></i>
          </span>
        </div>

        <div id="app" class="screen" aria-live="polite"></div>

        <nav class="tabbar" aria-label="Navegacion principal">
          <button class="tab-button is-active" data-view="home" aria-label="Inicio">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 10.7 12 4l8 6.7V20a1 1 0 0 1-1 1h-4.5v-6h-5v6H5a1 1 0 0 1-1-1z"/></svg>
            <span>Inicio</span>
          </button>
          <button class="tab-button" data-view="goals" aria-label="Objetivos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 19h5v-4h5v-4h6v8h-2v-6h-5v4H8v4H4zM5 8.5A2.5 2.5 0 1 1 10 8.5 2.5 2.5 0 0 1 5 8.5zm5.3 2.8 1.4-1.4 2.8 2.8-1.4 1.4z"/></svg>
            <span>Objetivos</span>
          </button>
          <button class="tab-button" data-view="challenges" aria-label="Retos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 14.7 8l5.6.8-4 3.9.9 5.5L12 15.6l-5.2 2.6.9-5.5-4-3.9L9.3 8z"/></svg>
            <span>Retos</span>
          </button>
          <button class="tab-button" data-view="friends" aria-label="Amigos">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8.5 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zm7-1a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM2 20a6.5 6.5 0 0 1 13 0zm12.4 0a7.8 7.8 0 0 0-2.1-4.9A5.5 5.5 0 0 1 22 18.6V20z"/></svg>
            <span>Amigos</span>
          </button>
          <button class="tab-button" data-view="profile" aria-label="Perfil">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zm-7 8a7 7 0 0 1 14 0z"/></svg>
            <span>Perfil</span>
          </button>
        </nav>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
